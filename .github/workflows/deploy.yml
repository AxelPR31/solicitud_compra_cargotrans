name: Deploy a producción

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull cambios
        shell: powershell
        run: |
          cd C:\proyecto-web\eskimo_app_consumos
          git pull origin main

      - name: Backend - instalar y compilar
        shell: powershell
        run: |
          cd C:\proyecto-web\eskimo_app_consumos\cs_erp_server
          npm install
          npm run build

      - name: Frontend - instalar y compilar
        shell: powershell
        run: |
          cd C:\proyecto-web\eskimo_app_consumos\cs_erp_frontend
          npm install
          npm run build

      - name: Reiniciar PM2
        shell: powershell
        run: |
          pm2 restart backend-api
          pm2 restart frontend-app

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          if ("${{ job.status }}" -eq "success") {
            $emoji = "✅"
            $msg = "Deploy exitoso"
          }
          else {
            $emoji = "❌"
            $msg = "Deploy falló"
          }

          $text = @"
          $emoji $msg

          Repo: ${{ github.repository }}
          Rama: ${{ github.ref_name }}
          Autor: ${{ github.actor }}

          Ver detalles:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          "@

          curl.exe -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" `
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" `
            --data-urlencode "text=$text"